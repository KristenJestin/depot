<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRD Detail — depot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Geist", sans-serif;
        --font-mono: "Geist Mono", monospace;
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);
        --color-sidebar: var(--sidebar);
        --color-sidebar-foreground: var(--sidebar-foreground);
        --color-sidebar-primary: var(--sidebar-primary);
        --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
        --color-sidebar-accent: var(--sidebar-accent);
        --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
        --color-sidebar-border: var(--sidebar-border);
        --color-sidebar-ring: var(--sidebar-ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
        --radius: 0.5rem;
        --background: oklch(0.14 0.004 260);
        --card: oklch(0.18 0.004 260);
        --muted: oklch(0.2 0.004 260);
        --secondary: oklch(0.22 0.008 260);
        --accent: oklch(0.24 0.008 260);
        --input: oklch(0.26 0.008 260);
        --border: oklch(0.24 0.004 260);
        --foreground: oklch(0.93 0.005 260);
        --card-foreground: oklch(0.93 0.005 260);
        --secondary-foreground: oklch(0.85 0.008 260);
        --muted-foreground: oklch(0.55 0.01 260);
        --accent-foreground: oklch(0.93 0.005 260);
        --popover: oklch(0.18 0.004 260);
        --popover-foreground: oklch(0.93 0.005 260);
        --primary: oklch(0.65 0.27 288);
        --primary-foreground: oklch(0.98 0 0);
        --ring: oklch(0.65 0.27 288);
        --destructive: oklch(0.55 0.22 25);
        --chart-1: oklch(0.65 0.27 288);
        --chart-2: oklch(0.68 0.16 165);
        --chart-3: oklch(0.72 0.17 75);
        --chart-4: oklch(0.65 0.18 330);
        --chart-5: oklch(0.7 0.16 145);
        --sidebar: oklch(0.11 0.004 260);
        --sidebar-foreground: oklch(0.6 0.008 260);
        --sidebar-accent: oklch(0.17 0.008 260);
        --sidebar-accent-foreground: oklch(0.93 0.005 260);
        --sidebar-border: oklch(0.2 0.004 260);
        --sidebar-primary: oklch(0.65 0.27 288);
        --sidebar-primary-foreground: oklch(0.98 0 0);
        --sidebar-ring: oklch(0.65 0.27 288);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Geist", sans-serif;
        background: var(--background);
        color: var(--foreground);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }

      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--muted-foreground);
      }

      @keyframes oc-ping {
        75%,
        100% {
          transform: scale(2.5);
          opacity: 0;
        }
      }
      @keyframes oc-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .live-dot {
        position: relative;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .live-dot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        animation: oc-ping 1.4s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .status-sq {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        font-family: "Geist", sans-serif;
        transition: opacity 0.15s;
      }
      .btn-primary:hover {
        opacity: 0.85;
      }

      .glow-primary {
        box-shadow: 0 0 0 2px oklch(0.65 0.27 288 / 0.2);
      }

      .thin-bar {
        height: 2px;
        background: var(--border);
        border-radius: 1px;
        overflow: hidden;
      }
      .thin-bar-fill {
        height: 100%;
        border-radius: 1px;
        background: var(--primary);
        transition: width 1s ease;
      }

      .slabel {
        font-size: 11px;
        color: var(--muted-foreground);
        font-weight: 500;
        letter-spacing: 0.01em;
        padding: 4px 12px;
        margin-bottom: 2px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.1s;
      }
      .row:hover {
        background: rgba(255, 255, 255, 0.044);
      }
      .row.selected {
        background: rgba(255, 255, 255, 0.072);
      }

      .effort-pill {
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--muted-foreground);
        background: var(--secondary);
        border: 1px solid color-mix(in oklch, var(--border) 60%, transparent);
        flex-shrink: 0;
      }

      .status-badge {
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
        padding: 1px 7px;
        border-radius: 4px;
        font-weight: 500;
      }

      .task-detail {
        margin: 0 8px 4px 8px;
        background: var(--card);
        border-left: 2px solid oklch(0.65 0.27 288 / 0.3);
        border-radius: 0 5px 5px 0;
        padding: 8px 12px;
      }

      .detail-label {
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--muted-foreground);
        margin-bottom: 2px;
      }

      .detail-text {
        font-size: 11px;
        color: var(--foreground);
        line-height: 1.5;
        opacity: 0.75;
      }

      .criteria-block {
        background: var(--secondary);
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 11px;
        color: var(--foreground);
        line-height: 1.5;
        opacity: 0.8;
      }

      .finding-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent);
      }
      .finding-row:last-child {
        border-bottom: none;
      }

      .finding-bar {
        width: 3px;
        min-height: 32px;
        border-radius: 2px;
        flex-shrink: 0;
        margin-top: 2px;
      }



      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.1s;
        color: var(--sidebar-foreground);
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
        font-family: "Geist", sans-serif;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.044);
      }
      .nav-item.active {
        background: rgba(255, 255, 255, 0.072);
        color: var(--sidebar-accent-foreground);
      }

      .kv-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 12px;
        font-size: 12px;
      }
      .kv-key {
        font-size: 11px;
        color: var(--muted-foreground);
        min-width: 72px;
        flex-shrink: 0;
      }
      .kv-val {
        color: var(--foreground);
        font-size: 12px;
      }

      [x-cloak] {
        display: none !important;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@marcreichel/alpine-auto-animate@latest/dist/alpine-auto-animate.min.js"
      defer
    ></script>
    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.store("mockupStep", {
          current: "A",
          steps: [],
          go(key) {
            this.current = key;
            if (typeof Motion !== "undefined")
              Motion.animate(
                "#mockup-root",
                { opacity: [0.6, 1], y: [6, 0] },
                { duration: 0.2, easing: "ease-out" },
              );
          },
        });
      });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.11/dist/cdn.min.js"></script>
  </head>
  <body>
    <div
      id="mockup-root"
      style="display: flex; height: 100vh; overflow: hidden"
      x-data="{
    activeTask: null,
    filter: 'all',
    showConfirm: false,
    showReviewPanel: false,
    init() {
      $store.mockupStep.steps = [
        { key: 'A', label: 'A. In Progress' },
        { key: 'B', label: 'B. Draft' },
        { key: 'C', label: 'C. Done' }
      ];
      $store.mockupStep.current = 'A';
      this.$nextTick(() => {
        if (typeof Motion !== 'undefined') {
          Motion.animate('.ani', { opacity: [0, 1], y: [10, 0] }, { delay: Motion.stagger(0.04), duration: 0.35, easing: 'ease-out' });
        }
      });
    },
    get prd() { return prds[$store.mockupStep.current]; },
    get filtered() {
      const t = this.prd.tasks;
      if (this.filter === 'todo') return t.filter(x => ['pending','in_progress','blocked'].includes(x.status));
      if (this.filter === 'done') return t.filter(x => ['done','skipped'].includes(x.status));
      return t;
    },
    get pct() {
      const t = this.prd.tasks;
      return t.length ? Math.round(t.filter(x => x.status === 'done').length / t.length * 100) : 0;
    },
    toggleTask(id) { this.activeTask = this.activeTask === id ? null : id; },
    doAction() {
      this.showConfirm = true;
      if (typeof Motion !== 'undefined') Motion.animate('#action-btn', { scale: [1, 1.06, 1] }, { duration: 0.25 });
    },
    openReview() {
      this.showReviewPanel = true;
      this.$nextTick(() => {
        if (typeof Motion !== 'undefined')
          Motion.animate('#review-panel', { x: ['100%', '0%'] }, { duration: 0.28, easing: [0.32, 0.72, 0, 1] });
      });
    }
  }"
      x-cloak
    >
      <!-- SIDEBAR -->
      <aside
        style="
          width: 220px;
          background: var(--sidebar);
          border-right: 1px solid var(--sidebar-border);
          display: flex;
          flex-direction: column;
          height: 100vh;
          overflow: hidden;
          flex-shrink: 0;
        "
      >
        <!-- Logo -->
        <div class="ani" style="padding: 12px 12px 8px 12px">
          <div style="display: flex; align-items: center; gap: 8px">
            <div
              style="
                width: 22px;
                height: 22px;
                border-radius: 6px;
                background: linear-gradient(135deg, oklch(0.65 0.27 288), oklch(0.75 0.22 280));
                flex-shrink: 0;
              "
            ></div>
            <div>
              <div
                style="
                  font-size: 13px;
                  font-weight: 600;
                  color: var(--sidebar-accent-foreground);
                  line-height: 1.2;
                "
              >
                depot
              </div>
              <div style="font-size: 10px; color: oklch(0.35 0.006 260); line-height: 1.2">
                serve
              </div>
            </div>
          </div>
        </div>

        <!-- Nav -->
        <nav style="padding: 4px 8px; flex: 1; overflow-y: auto">
          <div class="ani" style="margin-bottom: 2px">
            <button class="nav-item">
              <svg
                width="13"
                height="13"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <rect x="2" y="2" width="5" height="5" rx="1" />
                <rect x="9" y="2" width="5" height="5" rx="1" />
                <rect x="2" y="9" width="5" height="5" rx="1" />
                <rect x="9" y="9" width="5" height="5" rx="1" />
              </svg>
              Overview
            </button>
          </div>
          <div class="ani" style="margin-bottom: 2px">
            <button class="nav-item active">
              <svg
                width="13"
                height="13"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <rect x="2" y="2" width="12" height="3" rx="1" />
                <rect x="2" y="7" width="9" height="2" rx="1" />
                <rect x="2" y="11" width="11" height="2" rx="1" />
              </svg>
              PRD Detail
            </button>
          </div>
          <div class="ani" style="margin-bottom: 2px">
            <button class="nav-item">
              <svg
                width="13"
                height="13"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <circle cx="8" cy="8" r="6" />
                <path d="M8 5v3l2 2" />
              </svg>
              Live Session
            </button>
          </div>
          <div class="ani" style="margin-bottom: 2px">
            <button class="nav-item">
              <svg
                width="13"
                height="13"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="M2 12V6l6-3 6 3v6l-6 3-6-3z" />
              </svg>
              Activity
            </button>
          </div>
        </nav>

        <!-- Separator -->
        <div style="height: 1px; background: var(--sidebar-border); margin: 4px 0"></div>

        <!-- Workspaces -->
        <div style="padding: 4px 8px 8px 8px">
          <div class="slabel" style="padding: 4px 4px">Workspaces</div>
          <div class="row ani" style="padding: 5px 4px">
            <div class="live-dot" style="background: #4ade80">
              <div class="live-dot-ring" style="background: #4ade80; opacity: 0.4"></div>
            </div>
            <span
              style="
                font-size: 12px;
                color: var(--sidebar-foreground);
                font-family: &quot;Geist Mono&quot;, monospace;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
              "
              >~/projects/my-app</span
            >
          </div>
        </div>

        <!-- Version -->
        <div style="padding: 6px 12px 10px 12px; border-top: 1px solid var(--sidebar-border)">
          <span
            style="
              font-family: &quot;Geist Mono&quot;, monospace;
              font-size: 10px;
              color: oklch(0.35 0.006 260);
            "
            >v0.1.0 · serve</span
          >
        </div>
      </aside>

      <!-- MAIN -->
      <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden">
        <!-- TopBar -->
        <header
          class="ani"
          style="
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
          "
        >
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 12px; color: oklch(0.35 0.006 260)">PRDs /</span>
            <span
              style="
                font-size: 13px;
                font-weight: 600;
                color: var(--foreground);
                max-width: 400px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
              "
              x-text="prd.title"
            ></span>

            <!-- Status badge -->
            <template x-if="prd.status === 'draft'">
              <span
                class="status-badge"
                style="color: var(--muted-foreground); background: var(--secondary)"
                >draft</span
              >
            </template>
            <template x-if="prd.status === 'ready'">
              <span
                class="status-badge"
                style="color: var(--chart-3); background: oklch(0.72 0.17 75 / 0.12)"
                >ready</span
              >
            </template>
            <template x-if="prd.status === 'in_progress'">
              <span
                class="status-badge"
                style="
                  display: flex;
                  align-items: center;
                  gap: 5px;
                  color: var(--primary);
                  background: oklch(0.65 0.27 288 / 0.12);
                "
              >
                <span class="live-dot" style="background: var(--primary)">
                  <span
                    class="live-dot-ring"
                    style="background: var(--primary); opacity: 0.5"
                  ></span>
                </span>
                in_progress
              </span>
            </template>
            <template x-if="prd.status === 'done'">
              <span
                class="status-badge"
                style="color: var(--chart-5); background: oklch(0.7 0.16 145 / 0.12)"
                >done</span
              >
            </template>
            <template x-if="prd.status === 'canceled'">
              <span
                class="status-badge"
                style="color: var(--destructive); background: oklch(0.55 0.22 25 / 0.12)"
                >canceled</span
              >
            </template>
          </div>

          <div style="display: flex; align-items: center; gap: 12px">
            <template x-if="prd.tasks.length > 0">
              <span
                style="
                  font-family: &quot;Geist Mono&quot;, monospace;
                  font-size: 11px;
                  color: var(--muted-foreground);
                "
                x-text="prd.tasks.filter(t=>t.status==='done').length + '/' + prd.tasks.length + ' tasks'"
              ></span>
            </template>
            <template x-if="prd.review && prd.review.findings && prd.review.findings.length > 0">
              <button
                @click="openReview()"
                style="
                  font-size: 11px;
                  color: var(--chart-4);
                  background: oklch(0.65 0.18 330 / 0.1);
                  border: 1px solid oklch(0.65 0.18 330 / 0.25);
                  padding: 3px 9px;
                  border-radius: 4px;
                  cursor: pointer;
                  font-family: &quot;Geist&quot;, sans-serif;
                "
                x-text="'View ' + prd.review.findings.length + ' findings'"
              ></button>
            </template>
            <template x-if="prd.action">
              <div style="position: relative">
                <button
                  id="action-btn"
                  class="btn-primary"
                  @click="doAction()"
                  x-text="prd.action"
                ></button>
                <div
                  x-show="showConfirm"
                  x-transition
                  style="
                    position: absolute;
                    top: calc(100% + 6px);
                    right: 0;
                    background: var(--card);
                    border: 1px solid var(--border);
                    border-radius: 6px;
                    padding: 8px 12px;
                    white-space: nowrap;
                    z-index: 100;
                  "
                >
                  <div style="font-size: 11px; color: var(--muted-foreground); margin-bottom: 6px">
                    Confirm action?
                  </div>
                  <div style="display: flex; gap: 6px">
                    <button class="btn-primary" @click="showConfirm=false">Confirm</button>
                    <button
                      @click="showConfirm=false"
                      style="
                        font-size: 11px;
                        padding: 4px 9px;
                        border-radius: 4px;
                        border: 1px solid var(--border);
                        background: transparent;
                        color: var(--muted-foreground);
                        cursor: pointer;
                        font-family: &quot;Geist&quot;, sans-serif;
                      "
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </header>

        <!-- 3-column grid -->
        <div
          style="display: grid; grid-template-columns: 260px 1fr 280px; flex: 1; overflow: hidden"
        >
          <!-- COL 1: Tasks -->
          <div
            style="
              border-right: 1px solid var(--border);
              display: flex;
              flex-direction: column;
              overflow: hidden;
            "
          >
            <div class="ani" style="padding: 10px 0 4px 0; flex-shrink: 0">
              <div class="slabel">
                <span
                  >Tasks
                  <span
                    style="
                      font-family: &quot;Geist Mono&quot;, monospace;
                      font-size: 10px;
                      margin-left: 4px;
                    "
                    x-text="'· ' + prd.tasks.filter(t=>t.status==='done').length + '/' + prd.tasks.length"
                  ></span>
                </span>
              </div>
              <template x-if="prd.tasks.length > 0">
                <div style="padding: 2px 12px 6px 12px">
                  <div class="thin-bar">
                    <div class="thin-bar-fill" :style="'width:' + pct + '%'"></div>
                  </div>
                </div>
              </template>

              <!-- Filter tabs -->
              <div style="display: flex; gap: 2px; padding: 2px 12px 4px 12px">
                <template x-for="f in ['all','todo','done']" :key="f">
                  <button
                    @click="filter = f; activeTask = null;"
                    :style="filter === f
                  ? 'color:var(--foreground);border-bottom:1px solid var(--primary);'
                  : 'color:var(--muted-foreground);border-bottom:1px solid transparent;'"
                    style="
                      font-size: 11px;
                      font-weight: 500;
                      padding: 2px 6px 3px 6px;
                      background: transparent;
                      border: none;

                </template>

                    <span
                      class="status-sq"

                      style="
                        font-family: &quot;Geist Mono&quot;, monospace;

                        flex-shrink: 0;

                      x-text="'#' + task.id"

                    <!-- Title -->
                    <span
                      :style="{
                        'font-size': '12px',
                        'flex': '1 1 0%',
                        'min-width': '0',
                        'overflow': 'hidden',
                        'text-overflow': 'ellipsis',
                        'white-space': 'nowrap',
                        'line-height': '1.4',
                        'text-decoration': (task.status === 'done' || task.status === 'skipped') ? 'line-through' : 'none',

                    <!-- Chevron -->

                      :style="{
                        'width': '10px',

                        <div class="detail-text" x-text="task.desc.intent"></div>

                      <div>

                        <div class="detail-text" x-text="task.desc.scope"></div>
                      </div>
                      <div>
                        <div class="detail-label">NON-GOALS</div>
                        <div class="detail-text" x-text="task.desc.nongoals"></div>
                      </div>
                    </div>

                          font-size: 10px;
                          color: var(--chart-5);
                          letter-spacing: 0.04em;
                          margin-bottom: 3px;
                        "

                        INCLUDED

                      <p
                        style="font-size: 12px; color: var(--muted-foreground); line-height: 1.6"
